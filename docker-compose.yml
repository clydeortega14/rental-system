services:
  php:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: renthive_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - mysql
    networks:
      - renthive
  
  nginx:
    image: nginx:alpine
    container_name: renthive_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - .docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on: 
      - php
    networks:
      - renthive
  
  node: 
    image: node:22-alpine
    container_name: renthive_node
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    
    ports: 
      - "5173:5173"
    command: sh -c "npm install --no-save && npm run dev -- --host"
    networks: 
      - renthive
  
  mysql: 
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: iCt,pRbb&PMhg;O-
      MYSQL_PASSWORD: V5YpCv+=im@yxDsz
    ports:
      - "3303:3306"
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - renthive

networks:
  renthive:

volumes:
  mysql: